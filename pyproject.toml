[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prefix-caching-scheduling-optimization-based-nano-vllm"
version = "0.1.0"
authors = [{ name = "KawHimmy" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "A cache-aware prefill scheduling optimization project based on nano-vLLM"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flash-attn",
    "xxhash",
]

[project.urls]
Homepage = "https://github.com/KawHimmy/Prefix-Caching-Scheduling-Optimization-Based-Nano-Vllm"
Repository = "https://github.com/KawHimmy/Prefix-Caching-Scheduling-Optimization-Based-Nano-Vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]
